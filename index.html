<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speisekammer — Menü &amp; Einkaufsliste</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="site-head">
    <div class="site-head__mark">🍲🍳🥘</div>
    <div>
      <h1>Speisekammer</h1>
    </div>
    <div class="sync-indicator" id="syncIndicator" title="Verbindungsstatus">
      <span class="dot"></span><span class="sync-label">verbinde…</span>
    </div>
  </header>

  <main class="layout">

    <section class="panel" aria-labelledby="recipes-heading">
      <div class="panel__head">
        <h2 id="recipes-heading">Rezepte</h2>
        <span class="count" id="recipeCount">0</span>
      </div>

      <ul class="recipe-list" id="recipeList">
      </ul>

      <p class="empty-note" id="recipeEmpty">Noch keine Rezepte. Leg unten das erste an.</p>

      <details class="add-recipe" id="addRecipeDetails">
        <summary>+ Neues Rezept</summary>
        <form id="recipeForm" class="recipe-form">
          <label class="field">
            <span>Name</span>
            <input type="text" id="recipeName" placeholder="z. B. Omelette" required>
          </label>

          <div class="ingredients-editor" id="ingredientsEditor"></div>

          <button type="button" id="addIngredientRow" class="btn btn--ghost btn--small">+ Zutat</button>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Rezept speichern</button>
            <button type="button" id="cancelRecipe" class="btn btn--ghost">Abbrechen</button>
          </div>
        </form>
      </details>
    </section>

    <section class="panel panel--accent" aria-labelledby="plan-heading">
      <div class="panel__head">
        <h2 id="plan-heading">Menü</h2>
      </div>

      <div class="plan-controls">
        <button id="generateBtn" class="btn btn--primary btn--wide">Neues Menü würfeln</button>
      </div>

      <p class="empty-note" id="planEmpty">Noch kein Menü gewürfelt.</p>

      <ol class="menu-list" id="menuList"></ol>
    </section>

    <section class="panel" aria-labelledby="shopping-heading">
      <div class="panel__head">
        <h2 id="shopping-heading">Einkaufsliste</h2>
      </div>
      <p class="empty-note" id="shoppingEmpty">Erscheint, sobald ein Menü gewürfelt wurde.</p>
      <ul class="shopping-list" id="shoppingList"></ul>
      <h3 class="shopping-section" id="marktHeading" hidden>Markt</h3>
      <ul class="shopping-list" id="marktList" hidden></ul>
    </section>

    <section class="panel" aria-labelledby="zutaten-heading">
      <div class="panel__head">
        <h2 id="zutaten-heading">Zutaten</h2>
        <span class="count" id="zutatCount">0</span>
      </div>

      <form id="zutatForm" class="zutat-form">
        <input type="text" id="zutatName" placeholder="Neue Zutat, z. B. Ei" required>
        <select id="zutatUnit" aria-label="Einheit">
        </select>
        <label class="zutat-markt">
          <input type="checkbox" id="zutatMarkt">
          <span>Markt</span>
        </label>
        <button type="submit" class="btn btn--primary btn--small" id="zutatSubmit">Hinzufügen</button>
        <button type="button" class="btn btn--ghost btn--small" id="zutatCancel" hidden>Abbrechen</button>
      </form>

      <p class="empty-note" id="zutatEmpty">Noch keine Zutaten. Leg oben die erste an.</p>

      <ul class="zutat-list" id="zutatenList"></ul>
    </section>

  </main>

</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
